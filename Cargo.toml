[workspace]
members = [
    "crates/cleansys-core",
    "crates/cleansys-gui",
    "crates/cleansys-tui",
    "crates/cleansys-web",
]
resolver = "2"

[workspace.package]
version    = "0.24.1"
edition    = "2024"
rust-version = "1.90"
authors    = ["Sorin Albu-Irimies <sorinirimies@gmail.com>"]
license    = "MIT"
repository = "https://github.com/sorinirimies/cleansys"

# ── Shared dependency versions ─────────────────────────────────────────────────
# Pin versions here once; each crate's Cargo.toml references them with
# `{ workspace = true }` so there is a single source of truth.

[workspace.dependencies]
winresource = { version = "0.1", default-features = false }  # the .exe icon (cleansys-gui build script)
# Core / shared
anyhow      = "1.0"
# SQLite compiled in (no sqlite3 program needed, so Windows works too)
rusqlite    = { version = "0.43", features = ["bundled"] }
colored     = "3.1"
log         = "0.4"
env_logger  = "0.11"
directories = "6.0"
serde       = { version = "1.0", features = ["derive"] }
regex       = "1.13"
libc        = "0.2"
serde_json  = "1.0"
toml        = "1.2"
glob        = "0.3"
rayon       = "1.12"

# TUI (Ratatui)
ratatui       = "0.30"
crossterm     = "0.29"
tui-checkbox  = "0.6"
tui-chart     = "0.6"
tui-piechart  = "1.4"
tui-nuances   = "0.1.11"
unicode-width = "0.2"
clap          = { version = "4.6", features = ["derive", "env"] }

# GUI (Iced)
iced       = { version = "0.14", features = ["advanced", "canvas"] }
iced_fonts = { version = "0.3", features = ["bootstrap"] }
notify-rust = "4.19"

# Web (Topcoat) — needs Rust 1.98+
topcoat      = "0.12"
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }

# Dev dependencies
assert_cmd = "2.2"
predicates = "3.1"
tempfile   = "3.27"

# Internal crates
cleansys-core = { path = "crates/cleansys-core", version = "0.24.1" }

[workspace.lints.rust]
# FFI (libc, the Windows shell, AppKit) needs unsafe: each use allows it with a reason.
unsafe_code = "deny"
missing_debug_implementations = "warn"
# `pub` only for what another crate uses; then dead_code finds the rest.
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they give in an application (sizes, ratios and
# pixel maths cast freely; hex colours are clearer unsplit; docs are for users).
unreadable_literal = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"
# Debug-print paths on purpose (quotes and escapes make odd names visible in logs).
unnecessary_debug_formatting = "allow"
# Local helper items and `write!`-free string building read fine in small functions.
items_after_statements = "allow"
format_push_string = "allow"
# Handlers keep one signature (event/message in, Result out) even when a body can't fail.
unnecessary_wraps = "allow"
needless_pass_by_value = "allow"
# `assert!(x.is_empty())` is the clearer test form.
assert_is_empty = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
opt-level = 0

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
