[workspace]
members = [
    "crates/cleansys-core",
    "crates/cleansys-gui",
    "crates/cleansys-tui",
]
resolver = "2"

[workspace.package]
version    = "0.5.1"
edition    = "2021"
authors    = ["Sorin Albu-Irimies <sorinirimies@gmail.com>"]
license    = "MIT"
repository = "https://github.com/sorinirimies/cleansys"

# ── Shared dependency versions ─────────────────────────────────────────────────
# Pin versions here once; each crate's Cargo.toml references them with
# `{ workspace = true }` so there is a single source of truth.

[workspace.dependencies]
# Core / shared
anyhow      = "1.0"
colored     = "3.1"
log         = "0.4"
env_logger  = "0.11"
directories = "6.0"
serde       = { version = "1.0", features = ["derive"] }
regex       = "1.10"
once_cell   = "1.19"
users       = "0.11"
serde_json  = "1.0"

# TUI (Ratatui)
ratatui       = "0.30"
crossterm     = "0.29"
tui-checkbox  = "0.4"
tui-piechart  = "1.0"
tui-spinner   = "0.4"
clap          = { version = "4.4", features = ["derive"] }

# GUI (Iced)
iced       = { version = "0.14", features = ["advanced"] }
iced_fonts = { version = "0.3", features = ["bootstrap"] }
notify-rust = "4.0"

# Dev dependencies
assert_cmd = "2.0"
predicates = "3.0"
tempfile   = "3.8"

# Internal crates
cleansys-core = { path = "crates/cleansys-core", version = "0.5.1" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"