[workspace]
members = [
    "crates/cleansys-core",
    "crates/cleansys-gui",
    "crates/cleansys-tui",
    "crates/cleansys-web",
]
resolver = "2"

[workspace.package]
version    = "0.8.0"
edition    = "2021"
authors    = ["Sorin Albu-Irimies <sorinirimies@gmail.com>"]
license    = "MIT"
repository = "https://github.com/sorinirimies/cleansys"

# ── Shared dependency versions ─────────────────────────────────────────────────
# Pin versions here once; each crate's Cargo.toml references them with
# `{ workspace = true }` so there is a single source of truth.

[workspace.dependencies]
# Core / shared
anyhow      = "1.0"
colored     = "3.1"
log         = "0.4"
env_logger  = "0.11"
directories = "6.0"
serde       = { version = "1.0", features = ["derive"] }
regex       = "1.13"
once_cell   = "1.21"
users       = "0.11"
serde_json  = "1.0"
toml        = "0.9"
glob        = "0.3"
rayon       = "1.10"

# TUI (Ratatui)
ratatui       = "0.30"
crossterm     = "0.29"
tui-checkbox  = "0.4"
tui-piechart  = "1.0"
tui-spinner   = "0.4"
clap          = { version = "4.6", features = ["derive", "env"] }

# GUI (Iced)
iced       = { version = "0.14", features = ["advanced", "canvas"] }
iced_fonts = { version = "0.3", features = ["bootstrap"] }
notify-rust = "4.18"

# Web (Topcoat) — needs Rust 1.98+
topcoat      = "0.10"
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }

# Dev dependencies
assert_cmd = "2.2"
predicates = "3.1"
tempfile   = "3.27"

# Internal crates
cleansys-core = { path = "crates/cleansys-core", version = "0.8.0" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"