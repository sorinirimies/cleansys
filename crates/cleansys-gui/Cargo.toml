[package]
name = "cleansys-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CleanSys — desktop GUI for system cleanup on Linux, macOS, and Windows (Iced)"
readme = "README.md"
categories = ["gui", "filesystem", "os"]
keywords = ["clean", "system", "linux", "cleanup", "gui"]

[lib]
name = "cleansys_gui"
path = "src/lib.rs"

[[bin]]
name = "cleansys-gui"
path = "src/main.rs"

[dependencies]
cleansys-core = { workspace = true }
iced          = { workspace = true }
iced_fonts    = { workspace = true }
anyhow        = { workspace = true }
log           = { workspace = true }
env_logger    = { workspace = true }
notify-rust   = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# macOS: winit builds a menu bar with only the application menu, so the system's window
# commands (Minimize, Zoom, Move & Resize / tiling and the shortcuts that go with them, e.g.
# ⌃⌘←) are missing. `src/macos.rs` adds the standard Window menu. Same versions winit uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2            = "0.5"
objc2-app-kit    = { version = "0.2", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.2", features = ["NSString", "NSObject"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
