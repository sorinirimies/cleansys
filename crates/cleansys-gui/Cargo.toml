[package]
name = "cleansys-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CleanSys — desktop GUI for system cleanup on Linux, macOS, and Windows (Iced)"
readme = "README.md"
categories = ["gui", "filesystem", "os"]
keywords = ["clean", "system", "linux", "cleanup", "gui"]

[lib]
name = "cleansys_gui"
path = "src/lib.rs"

[[bin]]
name = "cleansys-gui"
path = "src/main.rs"

[dependencies]
cleansys-core = { workspace = true }
iced          = { workspace = true }
iced_fonts    = { workspace = true }
anyhow        = { workspace = true }
log           = { workspace = true }
env_logger    = { workspace = true }
notify-rust   = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
