[[cleaner.action]]
type = "project_artifacts"
markers = ["package.json"]
artifacts = [".next", ".nuxt", ".svelte-kit", ".turbo", ".parcel-cache", ".angular", ".vite", ".expo"]
label = "JS build cache"

[[cleaner]]
id = "proj-python"
name = "Python Project Caches"
description = "__pycache__, .pytest_cache, .mypy_cache, .ruff_cache, .tox, .ipynb_checkpoints"
