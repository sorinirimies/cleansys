# Project build output, discovered by scanning your project roots
# (see engine.json: scan_roots / min_age_days / exclude).
# Each artifact directory is only removed when a marker file sits next to it.

[[cleaner]]
id = "proj-rust"
name = "Rust target/ Directories"
description = "cargo build output (target/) of every Cargo project"
category = "Project Build Artifacts"
[[cleaner.action]]
type = "project_artifacts"
markers = ["Cargo.toml"]
artifacts = ["target"]
label = "Rust build"

[[cleaner]]
id = "proj-gradle"
name = "Gradle / Android build/ Directories"
description = "build/, .gradle/ and .kotlin/ of Gradle, Android and Kotlin projects"
category = "Project Build Artifacts"
[[cleaner.action]]
type = "project_artifacts"
markers = ["build.gradle", "build.gradle.kts", "settings.gradle", "settings.gradle.kts"]
artifacts = ["build", ".gradle", ".kotlin"]
label = "Gradle build"

[[cleaner]]
id = "proj-android-native"
name = "Android Native Build (.cxx)"
description = "CMake/NDK intermediates (.cxx/, externalNativeBuild/) of Android modules"
category = "Project Build Artifacts"
[[cleaner.action]]
type = "project_artifacts"
markers = ["build.gradle", "build.gradle.kts"]
artifacts = [".cxx", "externalNativeBuild"]
label = "Android NDK build"

[[cleaner]]
id = "proj-maven"
name = "Maven target/ Directories"
