# Platform-specific additions. Everything here exists on one OS only.

[[cleaner]]
id = "lin-gstreamer-registry"
name = "GStreamer Plugin Registry"
description = "GStreamer plugin registry cache (rebuilt on the next media playback)"
category = "Everyday Junk"
os = ["linux"]
[[cleaner.action]]
type = "delete"
paths = ["$XDG_CACHE_HOME/gstreamer-1.0/*"]
label = "GStreamer registry"

[[cleaner]]
id = "lin-baloo-index"
name = "KDE Baloo File Index"
description = "Baloo desktop-search index (can be large; rebuilt in the background by Baloo)"
category = "Everyday Junk"
risk = "moderate"
os = ["linux"]
process = ["baloo_file", "baloo_file_extractor"]
[[cleaner.action]]
type = "delete"
paths = ["$XDG_DATA_HOME/baloo/*"]
label = "Baloo index"

[[cleaner]]
id = "mac-carthage"
name = "Carthage Caches"
description = "Carthage binary and dependency caches (re-downloaded on the next build)"
category = "Developer Caches"
risk = "moderate"
os = ["macos"]
[[cleaner.action]]
type = "delete"
paths = ["~/Library/Caches/org.carthage.CarthageKit/*", "~/Library/Caches/carthage/*"]
label = "Carthage cache"

[[cleaner]]
id = "win-webview2-caches"
name = "WebView2 App Caches"
description = "Embedded-browser (WebView2) caches that Windows apps keep in their own folders"
category = "Everyday Junk"
os = ["windows"]
[[cleaner.action]]
type = "delete"
paths = ["$LOCALAPPDATA/*/EBWebView/Default/Cache/*", "$LOCALAPPDATA/*/EBWebView/Default/Code Cache/*", "$LOCALAPPDATA/*/EBWebView/Default/GPUCache/*"]
label = "WebView2 cache"

[[cleaner]]
id = "win-battlenet"
name = "Battle.net Cache & Logs"
description = "Blizzard Battle.net launcher cache and logs (rebuilt on the next launch)"
category = "Games"
os = ["windows"]
process = ["Battle.net.exe"]
[[cleaner.action]]
type = "delete"
paths = ["$LOCALAPPDATA/Battle.net/Cache/*", "$LOCALAPPDATA/Battle.net/Logs/*", "$PROGRAMDATA/Battle.net/Logs/*"]
label = "Battle.net cache"

[[cleaner]]
id = "win-ea-origin"
name = "EA app / Origin Cache"
description = "EA app and Origin launcher caches and logs (rebuilt on the next launch)"
category = "Games"
os = ["windows"]
process = ["EADesktop.exe", "Origin.exe"]
[[cleaner.action]]
type = "delete"
paths = ["$LOCALAPPDATA/Electronic Arts/EA Desktop/Cache/*", "$LOCALAPPDATA/Electronic Arts/EA Desktop/Logs/*", "$LOCALAPPDATA/Origin/Logs/*"]
label = "EA / Origin cache"

[[cleaner]]
id = "win-ubisoft-connect"
name = "Ubisoft Connect Cache & Logs"
description = "Ubisoft Connect launcher cache and logs (rebuilt on the next launch)"
category = "Games"
os = ["windows"]
process = ["UbisoftConnect.exe", "upc.exe"]
[[cleaner.action]]
type = "delete"
paths = ["$LOCALAPPDATA/Ubisoft Game Launcher/cache/*", "$LOCALAPPDATA/Ubisoft Game Launcher/logs/*"]
label = "Ubisoft Connect cache"

[[cleaner]]
id = "adobe-media-cache"
name = "Adobe Media Cache"
description = "Premiere / After Effects media cache and conformed audio (rebuilt when a project is reopened; can be many GB)"
category = "Everyday Junk"
risk = "moderate"
os = ["macos", "windows"]
process = ["Adobe Premiere Pro", "Adobe After Effects", "Adobe Media Encoder", "Adobe Premiere Pro.exe", "AfterFX.exe"]
[[cleaner.action]]
type = "delete"
macos = ["~/Library/Application Support/Adobe/Common/Media Cache Files/*", "~/Library/Application Support/Adobe/Common/Media Cache/*"]
windows = ["$APPDATA/Adobe/Common/Media Cache Files/*", "$APPDATA/Adobe/Common/Media Cache/*"]
label = "Adobe media cache"

[[cleaner]]
id = "mac-audio-content"
name = "GarageBand / Logic Sound Library"
description = "Downloaded GarageBand and Logic Pro sound packs and Apple Loops. Many GB to download again; only clean if you no longer use them"
category = "Maintenance & Tuning"
risk = "caution"
os = ["macos"]
requires_root = true
[[cleaner.action]]
type = "delete"
paths = ["/Library/Application Support/GarageBand/*", "/Library/Application Support/Logic/*", "/Library/Audio/Apple Loops/*"]
label = "GarageBand / Logic content"
