# Hand-maintained browser cleaners (browsers.toml is generated by scripts/gen_content_packs.nu,
# so anything added there is lost on the next `just gen-packs`).
#
#  - autofill / saved passwords / site preferences for the Chromium family, Firefox, LibreWolf, Zen
#  - Ladybird (layout verified on a real install: <cache|data>/Ladybird/Profiles/<profile>/...)
[[cleaner]]
id = "br-chrome-autofill"
name = "Google Chrome Autofill & Search Engines"
description = "Form autofill entries, saved addresses and custom search engines of Google Chrome (passwords and bookmarks are kept)"
category = "Web Browsers"
risk = "moderate"
os = ["linux", "macos", "windows"]
process = ["chrome", "google-chrome"]
[[cleaner.action]]
type = "delete"
linux = ["$XDG_CONFIG_HOME/google-chrome/Default/Web Data", "$XDG_CONFIG_HOME/google-chrome/Default/Web Data-journal", "$XDG_CONFIG_HOME/google-chrome/Profile */Web Data", "$XDG_CONFIG_HOME/google-chrome/Profile */Web Data-journal"]
macos = ["~/Library/Application Support/Google/Chrome/Default/Web Data", "~/Library/Application Support/Google/Chrome/Default/Web Data-journal", "~/Library/Application Support/Google/Chrome/Profile */Web Data", "~/Library/Application Support/Google/Chrome/Profile */Web Data-journal"]
windows = ["$LOCALAPPDATA/Google/Chrome/User Data/Default/Web Data", "$LOCALAPPDATA/Google/Chrome/User Data/Default/Web Data-journal", "$LOCALAPPDATA/Google/Chrome/User Data/Profile */Web Data", "$LOCALAPPDATA/Google/Chrome/User Data/Profile */Web Data-journal"]
label = "Google Chrome autofill & search engines"
[[cleaner]]
id = "br-chrome-passwords"
name = "Google Chrome Saved Passwords"
description = "Passwords saved in Google Chrome — DELETES them permanently; make sure they are in a password manager first"
category = "Web Browsers"
risk = "caution"
os = ["linux", "macos", "windows"]
process = ["chrome", "google-chrome"]
