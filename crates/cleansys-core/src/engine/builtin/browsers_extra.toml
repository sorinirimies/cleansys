[[cleaner.action]]
type = "delete"
linux = ["$XDG_CACHE_HOME/Ladybird/Profiles/*/RequestServer", "$XDG_CACHE_HOME/Ladybird/Profiles/*/SystemFacts.json"]
macos = ["~/Library/Caches/Ladybird/Profiles/*/RequestServer", "~/Library/Caches/Ladybird/Profiles/*/SystemFacts.json"]
windows = ["$LOCALAPPDATA/Ladybird/Profiles/*/RequestServer", "$LOCALAPPDATA/Ladybird/Profiles/*/SystemFacts.json"]
label = "Ladybird cache"
[[cleaner]]
id = "br-ladybird-history"
name = "Ladybird History & Sessions"
description = "Browsing history (History.db) and saved sessions (Sessions.db) of Ladybird; bookmarks and settings are kept"
category = "Web Browsers"
risk = "moderate"
os = ["linux", "macos", "windows"]
process = ["Ladybird", "ladybird"]
[[cleaner.action]]
type = "delete"
linux = ["$XDG_DATA_HOME/Ladybird/Profiles/*/History.db", "$XDG_DATA_HOME/Ladybird/Profiles/*/History.db-shm", "$XDG_DATA_HOME/Ladybird/Profiles/*/History.db-wal", "$XDG_DATA_HOME/Ladybird/Profiles/*/Sessions.db", "$XDG_DATA_HOME/Ladybird/Profiles/*/Sessions.db-shm", "$XDG_DATA_HOME/Ladybird/Profiles/*/Sessions.db-wal"]
macos = ["~/Library/Application Support/Ladybird/Profiles/*/History.db", "~/Library/Application Support/Ladybird/Profiles/*/History.db-shm", "~/Library/Application Support/Ladybird/Profiles/*/History.db-wal", "~/Library/Application Support/Ladybird/Profiles/*/Sessions.db", "~/Library/Application Support/Ladybird/Profiles/*/Sessions.db-shm", "~/Library/Application Support/Ladybird/Profiles/*/Sessions.db-wal"]
windows = ["$LOCALAPPDATA/Ladybird/Profiles/*/History.db", "$LOCALAPPDATA/Ladybird/Profiles/*/History.db-shm", "$LOCALAPPDATA/Ladybird/Profiles/*/History.db-wal", "$LOCALAPPDATA/Ladybird/Profiles/*/Sessions.db", "$LOCALAPPDATA/Ladybird/Profiles/*/Sessions.db-shm", "$LOCALAPPDATA/Ladybird/Profiles/*/Sessions.db-wal"]
label = "Ladybird history"
[[cleaner]]
id = "br-ladybird-crash-reports"
name = "Ladybird Crash Reports"
description = "Pending crash reports written by Ladybird"
category = "Web Browsers"
os = ["linux", "macos", "windows"]
process = ["Ladybird", "ladybird"]
[[cleaner.action]]
type = "delete"
linux = ["$XDG_DATA_HOME/Ladybird/Profiles/*/CrashReports/*"]
macos = ["~/Library/Application Support/Ladybird/Profiles/*/CrashReports/*"]
windows = ["$LOCALAPPDATA/Ladybird/Profiles/*/CrashReports/*"]
label = "Ladybird crash reports"

[[cleaner]]
id = "br-ladybird-cookies"
name = "Ladybird Cookies"
description = "Cookies of Ladybird (signs you out of sites); the rest of Ladybird.db is kept. Needs the sqlite3 program"
category = "Web Browsers"
risk = "moderate"
os = ["linux", "macos", "windows"]
process = ["Ladybird", "ladybird"]
[[cleaner.action]]
type = "sqlite_rows"
linux = ["$XDG_DATA_HOME/Ladybird/Profiles/*/Ladybird.db"]
macos = ["~/Library/Application Support/Ladybird/Profiles/*/Ladybird.db"]
windows = ["$LOCALAPPDATA/Ladybird/Profiles/*/Ladybird.db"]
tables = ["Cookies"]
label = "Ladybird cookies"

[[cleaner]]
id = "br-ladybird-site-data"
name = "Ladybird Site Data & HSTS"
description = "Local storage of websites and remembered HSTS policies in Ladybird.db, plus its download list; cookies are kept. Needs the sqlite3 program"
category = "Web Browsers"
risk = "moderate"
os = ["linux", "macos", "windows"]
process = ["Ladybird", "ladybird"]
[[cleaner.action]]
type = "sqlite_rows"
linux = ["$XDG_DATA_HOME/Ladybird/Profiles/*/Ladybird.db"]
macos = ["~/Library/Application Support/Ladybird/Profiles/*/Ladybird.db"]
windows = ["$LOCALAPPDATA/Ladybird/Profiles/*/Ladybird.db"]
tables = ["WebStorage", "HSTSPolicies", "Downloads"]
label = "Ladybird site data"
