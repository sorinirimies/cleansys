type = "delete"
paths = ["~/.android/avd/*.avd/snapshots", "~/.android/avd/*.avd/cache.img", "~/.android/avd/*.avd/cache.img.qcow2"]
label = "Android Emulator Snapshots"

[[cleaner]]
id = "dev-android-sdk-stale"
name = "Unused Android SDK System Images & NDKs"
description = "System images and NDK versions untouched for 120+ days (re-download via sdkmanager)"
category = "Developer Caches"
risk = "caution"
[[cleaner.action]]
type = "delete"
linux = ["~/Android/Sdk/system-images/*/*", "~/Android/Sdk/ndk/*", "~/Android/Sdk/cmake/*"]
macos = ["~/Library/Android/sdk/system-images/*/*", "~/Library/Android/sdk/ndk/*", "~/Library/Android/sdk/cmake/*"]
windows = ["$LOCALAPPDATA/Android/Sdk/system-images/*/*", "$LOCALAPPDATA/Android/Sdk/ndk/*", "$LOCALAPPDATA/Android/Sdk/cmake/*"]
label = "Unused Android SDK System Images & NDKs"

