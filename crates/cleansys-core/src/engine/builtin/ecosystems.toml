# Ecosystem caches beyond the core developer set: embedded, data science, cloud/IaC,
# IDEs, mobile SDKs, game and creative tools, cloud drives and desktop leftovers.
# Generated entries stay declarative: edit freely or override by id in your own TOML.

[[cleaner]]
id = "dev-platformio"
name = "PlatformIO Cache"
description = "Download and build cache of PlatformIO (installed platforms and packages stay)"
category = "Developer Caches"
[[cleaner.action]]
type = "delete"
paths = ["~/.platformio/.cache"]
label = "PlatformIO Cache"

[[cleaner]]
id = "dev-arduino"
name = "Arduino Build & Download Cache"
description = "Sketch build cache and staged downloads of Arduino IDE / CLI"
category = "Developer Caches"
[[cleaner.action]]
type = "delete"
linux = ["$XDG_CACHE_HOME/arduino/sketches", "~/.arduino15/staging"]
macos = ["~/Library/Caches/arduino/sketches", "~/Library/Arduino15/staging"]
windows = ["$LOCALAPPDATA/Temp/arduino/sketches", "$LOCALAPPDATA/Arduino15/staging"]
label = "Arduino Build & Download Cache"

