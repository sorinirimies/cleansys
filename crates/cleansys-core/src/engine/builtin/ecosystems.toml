[[cleaner.action]]
type = "delete"
linux = ["$XDG_CACHE_HOME/JetBrains/*/caches", "$XDG_CACHE_HOME/JetBrains/*/tmp", "$XDG_CACHE_HOME/JetBrains/*/compile-server"]
macos = ["~/Library/Caches/JetBrains/*/caches", "~/Library/Caches/JetBrains/*/tmp", "~/Library/Caches/JetBrains/*/compile-server"]
windows = ["$LOCALAPPDATA/JetBrains/*/caches", "$LOCALAPPDATA/JetBrains/*/tmp", "$LOCALAPPDATA/JetBrains/*/compile-server"]
