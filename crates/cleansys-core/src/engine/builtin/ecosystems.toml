[[cleaner]]
id = "dev-android-emulator-snapshots"
name = "Android Emulator Snapshots"
description = "Quick-boot snapshots and cache images of Android virtual devices (AVDs boot cold afterwards)"
category = "Developer Caches"
risk = "moderate"
process = ["emulator", "qemu-system-x86_64", "qemu-system-aarch64"]
