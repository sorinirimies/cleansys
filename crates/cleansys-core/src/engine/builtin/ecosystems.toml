[[cleaner]]
id = "dev-jetbrains-caches"
name = "JetBrains IDE Caches & Logs"
description = "Index/caches, temp and logs of IntelliJ, PyCharm, CLion, RustRover, WebStorm, GoLand and Rider (re-indexed on next open)"
