name: Nightly Dependency Upgrade

# Upgrades workspace dependencies every night, and — if anything actually
# changed — automatically cuts a new patch release (bump + changelog + tag +
# push) with no human approval step. The quality gate (fmt, clippy, test)
# must pass before either the dependency commit or the release tag are ever
# pushed, so a bad upgrade simply fails the workflow instead of shipping.
# A downgrade guard also runs before anything is committed, so a resolver
# fluke can never silently ship an older crate version.

on:
  schedule:
    # Runs at 03:00 UTC every day — offset from the Gitea run (02:00 UTC) so
    # the two mirrors don't race each other for the same tag.
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: deps-update
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  upgrade-deps:
    name: Upgrade Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── System libraries (required by the Iced GUI crate) ────────────────────
      - name: Install Linux GUI system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libssl-dev

      # ── Rust toolchain ────────────────────────────────────────────────────────
      - name: Install Rust stable (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # ── cargo-edit (provides `cargo upgrade`) ────────────────────────────────
      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      # ── Pre-warm cargo registry (refresh index + fetch sources) ────────────
      # `cargo upgrade`'s recursive-dep resolver runs in offline mode and only
      # considers package sources that are physically present in the local
      # cache. Running `cargo update` first refreshes the registry index and
      # rewrites Cargo.lock to non-yanked versions; `cargo fetch` then
      # downloads those sources so the offline phase has at least one valid
      # candidate for every transitive dependency.
      - name: Pre-warm cargo registry (refresh index + fetch sources)
        run: cargo update && cargo fetch

      # ── Snapshot Cargo.lock BEFORE upgrading, for the downgrade guard ───────
      - name: Snapshot Cargo.lock (pre-upgrade)
        run: cp Cargo.lock Cargo.lock.before

      # ── Upgrade all dependency pins ──────────────────────────────────────────
      # `cargo upgrade --incompatible allow` rewrites version constraints in
      # [workspace.dependencies] so pinned libs like `dirs = "5.0"` can advance
      # to "6.0", `nix = "0.29"` to "0.31", etc.
      # `cargo update` then resolves the new constraints into Cargo.lock.
      - name: Upgrade workspace dependency pins
        run: cargo upgrade --incompatible allow

      - name: Sync Cargo.lock
        run: cargo update

      # ── Downgrade guard ──────────────────────────────────────────────────────
      # Explicit safety net: fail the workflow if any crate's resolved version
      # went *down* relative to the pre-upgrade snapshot, before anything is
      # ever committed or released.
      - name: Install Nushell (needed for the downgrade guard)
        run: cargo install nu --locked

      - name: Guard against dependency downgrades
        run: nu scripts/ci/check_no_downgrade.nu --before Cargo.lock.before --after Cargo.lock

      - name: Remove downgrade-guard snapshot
        run: rm -f Cargo.lock.before

      # ── Check for changes ────────────────────────────────────────────────────
      # ── `cargo upgrade` (cargo-edit) reserializes the whole Cargo.toml via
      # toml_edit — it can reorder/reformat keys and whitespace even when no
      # dependency version actually changed. That alone must NOT count as a
      # real update (it previously caused empty releases to be tagged in a
      # sibling project). Cargo.lock is the ground truth: it only changes
      # when a resolved dependency version actually moves. Gate `has_changes`
      # on Cargo.lock only; Cargo.toml is still committed alongside it.
      - name: Check for changes
        id: check
        run: |
          if git diff --quiet Cargo.lock; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Quality gate ───────────────────────────────────────────────────────
      - name: Check formatting
        if: steps.check.outputs.has_changes == 'true'
        run: cargo fmt --all -- --check

      - name: Run clippy
        if: steps.check.outputs.has_changes == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A deprecated

      - name: Run tests
        if: steps.check.outputs.has_changes == 'true'
        run: cargo test --workspace --all-features --all-targets

      # ── Commit and push directly to main ────────────────────────────────────
      # The quality gate already passed — safe to push directly.
      - name: Commit and push dependency updates
        if: steps.check.outputs.has_changes == 'true'
        run: |
          DATE=$(date -u '+%Y-%m-%d')

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Cargo.toml Cargo.lock
          git commit -m "chore(deps): nightly dependency upgrade $DATE"
          git push origin main

          echo "✅ Dependency updates pushed to main."

      # ── Automatic patch release ─────────────────────────────────────────────
      # Cuts a new patch version (X.Y.Z -> X.Y.Z+1) for the dependency bump
      # above and pushes the tag, which triggers the full Release workflow
      # (build, package, crates.io publish, AUR update) — no human approval
      # in the loop.
      - name: Install git-cliff
        if: steps.check.outputs.has_changes == 'true'
        run: cargo install git-cliff --locked

      - name: Cut automatic patch release
        if: steps.check.outputs.has_changes == 'true'
        run: nu scripts/ci/auto_patch_release.nu

      # ── Explicitly dispatch the Release workflow ────────────────────────────
      # A tag pushed with the default GITHUB_TOKEN does NOT auto-trigger other
      # tag-push-triggered workflows (anti-recursion safeguard) — so dispatch
      # release.yml directly via the Actions API instead, which the same
      # default token IS allowed to do.
      - name: Get newly-released version
        if: steps.check.outputs.has_changes == 'true'
        id: new_version
        run: echo "tag=v$(grep -m1 '^version' Cargo.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"(.*)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Dispatch Release workflow
        if: steps.check.outputs.has_changes == 'true'
        run: gh workflow run release.yml --field tag="${{ steps.new_version.outputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Nothing to update
        if: steps.check.outputs.has_changes == 'false'
        run: echo "✅ All dependencies already up to date — nothing to upgrade."
